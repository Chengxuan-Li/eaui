name: Pages

# Verifies every push and pull request, and publishes master to GitHub Pages
# (decision 0017). One job, so the checkout, npm ci, and browser install happen
# once and the production spec reuses the build the deploy publishes. The
# browser specs stub OpenFreeMap and Mapterhorn through e2e/test.ts, so the
# whole run stays offline.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Never cancel a deploy half way; superseded pull request runs may go.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Checks, tests, and build
    runs-on: ubuntu-latest
    env:
      # Microsoft Edge is the local default; CI uses Playwright's own Chromium.
      PLAYWRIGHT_CHANNEL: chromium
      # A project site lives under /<repository>/; a rename follows along. Set
      # for the whole job, not just the build, so `vite preview` and the
      # production spec use the prefix the bundle was built with.
      EAUI_BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:e2e

      - run: npm run build
      # Checks the bundle just built, rather than building a second time.
      - run: npx playwright test -c playwright.preview.config.ts

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    # Only master publishes; pull requests stop after the checks.
    if: github.event_name != 'pull_request'
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
